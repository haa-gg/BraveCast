<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BraveCast Remote • Living Room TV</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(26, 34, 52, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --spotify-green: #1db954;
      --yt-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .badge-online {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Card styling */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Service Banner */
    .service-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(29, 185, 84, 0.1);
      border: 1px solid rgba(29, 185, 84, 0.3);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
    }

    .service-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4ade80;
      font-weight: 600;
    }

    /* Input Bar */
    .cast-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cast-form label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-cast {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-cast:active {
      transform: scale(0.97);
    }

    /* Quick Launch Row */
    .quick-launch-row {
      display: flex;
      gap: 10px;
    }

    .btn-launch {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-launch.yt {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }

    .btn-launch.spotify {
      background: linear-gradient(135deg, #1db954, #16a34a);
      color: white;
    }

    .btn-launch:active {
      transform: scale(0.97);
    }

    /* Now Playing Card */
    .now-playing {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .stream-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      font-weight: 700;
    }

    .stream-title {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      cursor: pointer;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    /* Control Buttons */
    .controls-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 6px;
    }

    .btn-circle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-circle:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-circle.large {
      width: 68px;
      height: 68px;
      font-size: 26px;
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      border: none;
      box-shadow: 0 6px 24px rgba(168, 85, 247, 0.4);
    }

    /* Sub controls */
    .sub-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 14px;
      margin-top: 8px;
    }

    .vol-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 220px;
    }

    .btn-icon-sub {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
    }

    .btn-icon-sub:hover {
      color: white;
    }

    /* History List */
    .history-card h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .history-item:hover {
      background: rgba(168, 85, 247, 0.15);
    }

    .history-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .history-btn {
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <div class="header">
      <div class="brand">
        <h1>BraveCast Remote</h1>
      </div>
      <div class="badge-online">
        <div class="dot"></div>
        <span>Living Room TV (Mac)</span>
      </div>
    </div>

    <!-- Spotify Connect Notification Banner -->
    <div class="service-banner">
      <div class="service-left">
        <span>🟢</span>
        <span>Spotify Connect: "Living Room TV (Mac)" is broadcasting</span>
      </div>
    </div>

    <!-- Quick Cast Form -->
    <div class="card cast-form">
      <label>Beam Video to TV</label>
      <div class="input-row">
        <input type="text" id="stream-url-input" placeholder="Paste .m3u8 or video URL..." autocomplete="off">
        <button class="btn-cast" id="cast-btn">🚀 Cast</button>
      </div>

      <!-- Quick Launch Apps -->
      <div class="quick-launch-row">
        <button class="btn-launch yt" id="yt-btn">
          <span>📺</span>
          <span>YouTube on TV (Ad-Free)</span>
        </button>
        <button class="btn-launch" id="autoplay-toggle-btn" style="background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.4); color: #c084fc; flex: 1;">
          <span>♾️</span>
          <span id="autoplay-label">Autoplay: ON</span>
        </button>
      </div>
    </div>

    <!-- Now Playing Card -->
    <div class="card now-playing" id="player-card">
      <div class="stream-tag" id="status-tag">Ambient Standby</div>
      <div class="stream-title" id="now-title">Ready for casting</div>

      <div class="progress-box">
        <input type="range" id="seek-bar" min="0" max="100" value="0">
        <div class="time-labels">
          <span id="time-curr">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls-grid">
        <button class="btn-circle" id="btn-back" title="Rewind 10s">⏪</button>
        <button class="btn-circle large" id="btn-playpause" title="Play / Pause">▶️</button>
        <button class="btn-circle" id="btn-fwd" title="Forward 30s">⏩</button>
        <button class="btn-circle" id="btn-skip" title="Next Video (Doomscroll Autopilot)">⏭️</button>
      </div>

      <div class="sub-controls">
        <div class="vol-row">
          <button class="btn-icon-sub" id="btn-mute">🔊</button>
          <input type="range" id="vol-bar" min="0" max="1" step="0.05" value="1">
        </div>
        <div style="display: flex; gap: 12px;">
          <button class="btn-icon-sub" id="btn-fs" title="Toggle Fullscreen">⛶</button>
          <button class="btn-icon-sub" id="btn-stop" title="Stop Playback" style="color: #ef4444;">⏹️ Stop</button>
        </div>
      </div>
    </div>

    <!-- Recent History -->
    <div class="card history-card">
      <h3>Recent Streams</h3>
      <div id="history-container">
        <div style="font-size: 13px; color: var(--text-muted); text-align: center; padding: 12px;">
          No recent streams yet.
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('stream-url-input');
    const castBtn = document.getElementById('cast-btn');
    const ytBtn = document.getElementById('yt-btn');
    const statusTag = document.getElementById('status-tag');
    const nowTitle = document.getElementById('now-title');
    const seekBar = document.getElementById('seek-bar');
    const timeCurr = document.getElementById('time-curr');
    const timeTotal = document.getElementById('time-total');
    const btnPlayPause = document.getElementById('btn-playpause');
    const btnBack = document.getElementById('btn-back');
    const btnFwd = document.getElementById('btn-fwd');
    const btnSkip = document.getElementById('btn-skip');
    const btnAutoplayToggle = document.getElementById('autoplay-toggle-btn');
    const autoplayLabel = document.getElementById('autoplay-label');
    const btnMute = document.getElementById('btn-mute');
    const volBar = document.getElementById('vol-bar');
    const btnFs = document.getElementById('btn-fs');
    const btnStop = document.getElementById('btn-stop');
    const historyContainer = document.getElementById('history-container');

    let isSeeking = false;

    function formatTime(secs) {
      if (!secs || isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function sendControl(action, value = null) {
      fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action, value: value })
      }).catch(err => console.error("Control error:", err));
    }

    function castStream(url, title = null) {
      if (!url) return;
      fetch('/api/cast', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url, title: title })
      })
      .then(r => r.json())
      .then(res => {
        urlInput.value = '';
        fetchStatus();
      })
      .catch(err => alert("Cast failed: " + err));
    }

    castBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (url) castStream(url);
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const url = urlInput.value.trim();
        if (url) castStream(url);
      }
    });

    ytBtn.addEventListener('click', () => {
      ytBtn.textContent = "⏳ Launching...";
      fetch('/api/youtube', { method: 'POST' })
        .then(() => {
          ytBtn.innerHTML = "<span>📺</span><span>YouTube on TV (Ad-Free)</span>";
          fetchStatus();
        })
        .catch(err => alert("Failed to launch YouTube: " + err));
    });

    btnPlayPause.addEventListener('click', () => sendControl('toggle'));
    btnBack.addEventListener('click', () => sendControl('seek', 'back'));
    btnFwd.addEventListener('click', () => sendControl('seek', 'fwd'));
    btnSkip.addEventListener('click', () => sendControl('skip'));
    btnAutoplayToggle.addEventListener('click', () => sendControl('toggle_autoplay'));
    btnMute.addEventListener('click', () => sendControl('mute'));
    btnFs.addEventListener('click', () => sendControl('fullscreen'));
    btnStop.addEventListener('click', () => sendControl('stop'));

    seekBar.addEventListener('input', () => { isSeeking = true; });
    seekBar.addEventListener('change', () => {
      const targetSec = parseFloat(seekBar.value);
      sendControl('seek', targetSec);
      isSeeking = false;
    });

    volBar.addEventListener('input', () => {
      sendControl('volume', parseFloat(volBar.value));
    });

    function fetchStatus() {
      fetch('/api/status')
        .then(r => r.json())
        .then(data => {
          if (data.state === 'playing') {
            statusTag.textContent = "Playing on TV";
            statusTag.style.color = "#22c55e";
            btnPlayPause.textContent = "⏸️";
          } else if (data.state === 'paused') {
            statusTag.textContent = "Paused";
            statusTag.style.color = "#eab308";
            btnPlayPause.textContent = "▶️";
          } else {
            statusTag.textContent = "Ambient Standby";
            statusTag.style.color = "#a855f7";
            btnPlayPause.textContent = "▶️";
          }

          if (data.stream) {
            nowTitle.textContent = data.stream.title || data.stream.url;
          } else {
            nowTitle.textContent = "Ready for casting";
          }

          if (!isSeeking && data.duration > 0) {
            seekBar.max = data.duration;
            seekBar.value = data.currentTime;
            timeCurr.textContent = formatTime(data.currentTime);
            timeTotal.textContent = formatTime(data.duration);
          }

          if (data.autoplay && autoplayLabel) {
            autoplayLabel.textContent = "Autoplay: " + (data.autoplay.enabled ? "ON" : "OFF");
            btnAutoplayToggle.style.borderColor = data.autoplay.enabled ? "rgba(168, 85, 247, 0.6)" : "rgba(255, 255, 255, 0.2)";
          }

          if (typeof data.volume === 'number') {
            volBar.value = data.volume;
            btnMute.textContent = data.muted || data.volume === 0 ? "🔇" : "🔊";
          }

          if (data.history && data.history.length > 0) {
            historyContainer.innerHTML = data.history.map(item => `
              <div class="history-item" onclick="castStream('${item.url}', '${item.title.replace(/'/g, "\\'")}')">
                <div class="history-title">${item.title}</div>
                <div class="history-btn">Re-cast 🚀</div>
              </div>
            `).join('');
          }
        })
        .catch(() => {});
    }

    setInterval(fetchStatus, 1500);
    fetchStatus();
  </script>
</body>
</html>
